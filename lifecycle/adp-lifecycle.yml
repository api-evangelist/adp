  detail: >-
    ADP publishes no API deprecation or sunset policy on its developer portal. There is no RFC 8594
    Sunset or Deprecation header in any of the 362 harvested operations, no retirement notice page,
    and no dated deprecation schedule. Partners learn of retirements through their ADP representative
    or Marketplace Technical Advisor. This is a real gap for an integrator planning multi-year
    dependency on a v1 resource that already has a v2 alongside it.
