- aid: adp:adp-workers-api
  name: ADP Workers API
  tags:
  - Payroll
  - HR
  - HCM
  - Workforce
  - Workers
  image: https://raw.githubusercontent.com/api-evangelist/adp/refs/heads/main/image.png
  humanURL: https://developers.adp.com/
  baseURL: https://api.adp.com
  properties:
  - url: https://developers.adp.com/
    type: Documentation
  - url: https://developers.adp.com/articles/guides/workers-management-api-guide-for-adp-expert
    type: Reference
  - url: https://developers.adp.com/getting-started/client-integration-overview
    type: GettingStarted
  - url: https://raw.githubusercontent.com/api-evangelist/adp/refs/heads/main/openapi/adp-workers-openapi.yml
    type: OpenAPI
  description: >-
    The ADP Workers API enables access to employee and worker data including personal information, job assignments, pay grades, and employment status. REST APIs support worker lifecycle management for HCM integrations across ADP Workforce Now, Vantage HCM, and Enterprise HR platforms.

- aid: adp:adp-payroll-api
  name: ADP Payroll API
  tags:
  - Payroll
  - HR
  - HCM
  - CSV
  - Compensation
  image: https://raw.githubusercontent.com/api-evangelist/adp/refs/heads/main/image.png
  humanURL: https://developers.adp.com/
  baseURL: https://api.adp.com
  properties:
  - url: https://developers.adp.com/
    type: Documentation
  - url: https://developers.adp.com/articles/guides/payroll-output-api-guide-for-adp-link
    type: Reference
  - url: https://developers.adp.com/getting-started/client-integration-overview
    type: GettingStarted
  - url: https://raw.githubusercontent.com/api-evangelist/adp/refs/heads/main/openapi/adp-payroll-openapi.yml
    type: OpenAPI
  description: >-
    The ADP Payroll API provides programmatic access to payroll processing, payroll output data, and compensation management. REST APIs support payroll runs, payroll output retrieval (including CSV-formatted bulk data), and headcount and compensation analysis across ADP payroll platforms.

- aid: adp:adp-embedded-payroll-api
  name: ADP Embedded Payroll API
  tags:
  - Payroll
  - Embedded
  - HCM
  - Small Business
  image: https://raw.githubusercontent.com/api-evangelist/adp/refs/heads/main/image.png
  humanURL: https://developers.adp.com/getting-started/embedded-payroll
  baseURL: https://api.adp.com
  properties:
  - url: https://developers.adp.com/getting-started/embedded-payroll
    type: Documentation
  - url: https://developers.adp.com/getting-started/embedded-payroll
    type: GettingStarted
  description: >-
    The ADP Embedded Payroll API enables ISVs and platforms to embed ADP payroll capabilities directly into their applications. REST APIs support payroll processing, tax compliance, and workforce management embedded within partner software products.

- aid: adp:adp-benefits-api
  name: ADP Benefits Administration API
  tags:
  - Benefits
  - HR
  - HCM
  - Enrollment
  image: https://raw.githubusercontent.com/api-evangelist/adp/refs/heads/main/image.png
  humanURL: https://developers.adp.com/
  baseURL: https://api.adp.com
  properties:
  - url: https://developers.adp.com/
    type: Documentation
  description: >-
    The ADP Benefits Administration API provides access to employee benefits enrollment, eligibility, and plan data. APIs support benefits carrier connectivity, open enrollment workflows, and benefits data exchange for insurance carriers and benefits administrators.

