- type: Features
  data:
  - name: Worker Lifecycle Management
    description: Manage the complete worker lifecycle including hiring, onboarding,
      job changes, and termination through REST APIs.
  - name: Payroll Processing
    description: Programmatic access to payroll runs, payroll output data, and compensation
      analysis across ADP platforms.
  - name: Embedded Payroll
    description: Embed ADP payroll capabilities directly into ISV and partner applications
      with white-label support.
  - name: Benefits Administration
    description: Manage employee benefits enrollment, eligibility, and plan data with
      carrier connectivity support.
  - name: Organizational Data
    description: Access department structures, organizational hierarchies, and work
      assignment data.
  - name: Bulk Data Export
    description: Retrieve payroll and workforce data in CSV-formatted bulk exports
      for analytics and reporting.
- type: UseCases
  data:
  - name: HCM Integration
    description: Synchronize worker data between ADP and third-party HRIS, ERP, and
      workforce management systems.
  - name: Payroll Automation
    description: Automate payroll instruction submission and output retrieval for
      streamlined payroll processing workflows.
  - name: Workforce Analytics
    description: Extract headcount, compensation, and departmental data for workforce
      planning and business intelligence.
  - name: ISV Embedded Payroll
    description: Integrate ADP payroll processing directly into partner software applications
      for small business customers.
- type: Integrations
  data:
  - name: ADP Workforce Now
    description: Full integration with ADP Workforce Now for mid-market HR, payroll,
      talent, and benefits management.
  - name: ADP Vantage HCM
    description: Enterprise-grade HCM integration for large organizations with complex
      payroll and HR requirements.
  - name: ADP RUN Powered by ADP
    description: Payroll and HR integration for small businesses using the ADP RUN
      platform.
