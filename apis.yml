- aid: automatic-data-processing:event-notifications-api
  name: ADP Event Notifications API
  description: >-
    ADP's change-data-capture surface. When data changes in an ADP product ADP generates an event notification
    and delivers it either into the subscriber's FIFO message queue, drained with GET/DELETE /core/v1/event-notification-messages,
    or — since October 2025 — by POSTing it to a partner-hosted webhook endpoint signed with an HMAC-SHA256
    adpx-messageauthentication header. Events must be subscribed per application; an unsubscribed event
    is never delivered.
  humanURL: >-
    https://developers.adp.com/getting-started/key-concepts/adp-event-apis-and-event-notification-guide
  baseURL: https://api.adp.com
  tags:
  - Event
  - Webhook
  - Event Notifications
  - Change Data Capture
  - Integration
  tags_raw:
  - Events
  - Webhooks
  - Event Notifications
  - Change Data Capture
  - Integration
  properties:
  - type: Documentation
    url: >-
      https://developers.adp.com/getting-started/key-concepts/adp-event-apis-and-event-notification-guide
  - type: Webhooks
    url: asyncapi/adp-event-notifications-webhooks.yml
  - type: Portal
    url: https://developers.adp.com
- aid: automatic-data-processing:embedded-payroll
  name: ADP Embedded Payroll (RUN)
  description: >-
    ADP Embedded Payroll lets a software platform embed complete RUN Powered by ADP payroll screens —
    "Journeys" for People, Payroll, Reports, Taxes, Onboarding and Settings — inside its own product via
    a client-side JavaScript SDK and an iframe, alongside REST APIs for mutual-client linking and SSO.
    It is the only ADP developer library still actively maintained, and it has its own documentation site
    with a published llms.txt.
  humanURL: https://adpembeddedpayroll.readme.io/docs/overview-1
  baseURL: https://api.adp.com
  tags:
  - Embedded Payroll
  - Run
  - JavaScript SDK
  - Embedded Finance
