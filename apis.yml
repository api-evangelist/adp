- aid: automatic-data-processing:event-notifications-api
  name: ADP Event Notifications API
  description: ADP's change-data-capture surface. When data changes in an ADP product ADP generates an event notification and delivers it either into the subscriber's FIFO message queue, drained with GET/DELETE /core/v1/event-notification-messages, or — since October 2025 — by POSTing it to a partner-hosted webhook endpoint signed with an HMAC-SHA256 adpx-messageauthentication header. Events must be subscribed per application; an unsubscribed event is never delivered.
  humanURL: https://developers.adp.com/getting-started/key-concepts/adp-event-apis-and-event-notification-guide
  baseURL: https://api.adp.com
