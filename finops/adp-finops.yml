specification: FinOps Framework
specificationVersion: '1.0'
schema: https://www.finops.org/framework/
provider: ADP
providerId: adp
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
notes: ADP API pricing is custom and contract-based. FinOps mapping is approximate; actual
  invoice line items depend on the negotiated agreement.
tags:
  - FinOps
  - FOCUS
  - HCM
  - Payroll
  - HR
description: 'FOCUS-aligned FinOps for ADP: contract-based partner pricing for HCM, payroll, and
  benefits APIs.'
sources:
  - https://developers.adp.com/
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
publisherName: ADP, Inc.
serviceCategory: Human Capital Management
billingModel:
  pricingCategory: Subscription
  billingFrequency: Monthly
  billingCurrency: USD
  chargeCategories:
    - Purchase
    - Usage
    - Adjustment
focusColumns:
  ServiceName: ADP
  ServiceCategory: Human Capital Management
  ProviderName: ADP
  PublisherName: ADP, Inc.
  InvoiceIssuerName: ADP, Inc.
  BillingCurrency: USD
meters:
  - name: api_requests
    unit: request
    aggregation: sum
    dimensions:
      - api
      - environment
      - partner
  - name: active_workers
    unit: worker
    aggregation: max
    dimensions:
      - client
      - country
  - name: payroll_runs
    unit: run
    aggregation: sum
    dimensions:
      - client
      - country
  - name: subscription_fees
    unit: month
    aggregation: sum
    dimensions:
      - product
principles:
  - name: Visibility
    description: Use ADP partner reports and the contracted usage API to track per-client request
      and worker counts.
  - name: Allocation
    description: Tag API calls with the end-client identifier and the consuming product to support
      partner chargeback.
  - name: Optimization
    description: Cache reference data; batch worker reads; consult ADP account team about volume
      tier renegotiation.
  - name: Accountability
    description: Reconcile monthly ADP invoices against contracted minimums and active-worker counts;
      assign budget owner per ADP product.
