  finding: Every first-party ADP client library is abandoned. The newest official release across four registries is adp-core
    2.4.10 on 2018-05-02; the Java and .NET libraries have not shipped since 2016. Meanwhile ADP's Workforce Now contracts
    were last modified in 2025 and the platform added webhook delivery in October 2025. An integrator following ADP's
    own "client connection libraries" page is being pointed at code seven to ten years older than the API it wraps. There
    is no first-party Python, Go, Ruby or PHP client at all.
  source_repositories_gone: 'All six packages declare their source as github.com/adplabs/*. The adplabs organization
    still exists in the GitHub API as "ADP Innovation Labs" but serves 404 on the web and reports public_repos: 0 — every
    linked source repository has been removed. ADP''s live public GitHub organization is github.com/adpllc (3 public
    repositories).'
