    - {write: worker.leave.request, reverse: worker.leave.cancel, operationId: 5723b54d-cd30-4fc9-a2f4-f761bb76803b, window: not stated}
    - {write: worker.work-assignment (hire), reverse: worker.work-assignment.terminate, operationId: 9b1be338-a34e-4ae2-8255-f7ae20aec06d, window: not stated}
    - {write: worker.work-assignment.terminate, reverse: worker.rehire, operationId: f3355703-f654-47ee-a98a-f67b74c4b364, window: not stated}
    - {write: worker.photo.change, reverse: worker.photo.remove, operationId: 60b868b8-99f7-4662-9181-33fa6ee24dd3, window: not stated}
    - {write: us-tax-profile.local-income-tax-instruction.add, reverse: us-tax-profile.local-income-tax-instruction.remove, operationId: dfe2e3e6-1924-4c2a-a84e-54c3e895ec49, window: not stated}
