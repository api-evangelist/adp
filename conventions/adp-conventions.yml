architecture:
  style: >-
    ADP's REST surface is deliberately CQRS-shaped. Reads are ordinary GETs against resource
    collections (/hr/v2/workers). Writes are NOT PUT/PATCH on those resources — they are POSTs of a
    named *event* to /events/<domain>/v1/<event.name> (worker.personal-communication.email.add,
    worker.leave.cancel, worker.rehire). 194 of the 362 harvested operations are GETs; 168 are event
    posts and their /meta descriptors. An agent that expects to PATCH a worker will not find the
    operation — it must post the event that expresses the change.
  read_write_split: true
  event_post_shape: 'POST /events/{domain}/v1/{eventNameCode} with body {"events":[{serviceCategoryCode, eventNameCode, originator, actor, data:{eventContext, transform}}]}'
authentication:
  style: OAuth 2.0 bearer token over mutual TLS
  detail: authentication/automatic-data-processing-authentication.yml
pagination:
  style: OData $top / $skip offset paging
  params: ['$top', '$skip']
  occurrences: {'$top': 25, '$skip': 25}
  example: 'GET https://api.adp.com/hr/v2/workers?$top=20&$skip=50'
  end_of_collection: >-
    When $skip passes the end of the collection ADP returns 400 Bad Request carrying a ConfirmMessage
    rather than an empty 200 — an agent must treat a 400 at the paging boundary as "no more rows",
    not as an error.
  source: https://developers.adp.com/getting-started/key-concepts/introduction-to-adp-api-open-data-protocol-odata
filtering_and_shaping:
  standard: OData URL conventions (v3 subset)
  params: ['$filter', '$select', '$orderby', '$count', '$expand', '$search']
  occurrences: {'$filter': 145, '$select': 15, '$orderby': 2, '$count': 7, '$expand': 7, '$search': 6}
  get_only: true
  capability_discovery: >-
    Append /meta to any resource to ask which OData options that operation actually supports; the
    response carries queryOptionCode entries ("$select", "$filter"). Supported $filter resource paths
    vary by ADP product, so /meta is the only reliable way to know before calling.
  source: https://developers.adp.com/getting-started/key-concepts/introduction-to-adp-api-open-data-protocol-odata
runtime_schema_discovery:
  mechanism: /meta
  description: >-
    ADP's most distinctive convention. GET <event-or-resource>/meta returns the validation and
    presentation rules that apply to the caller in the current context: which fields are required,
    readOnly or hidden, maxLength/minLength, regex patterns, min/maxItems on arrays, and enumerated
    codeList values. The rules are context-dependent, so the same event can require different fields
    for different clients. ADP states an API user "must use the Meta API response in conjunction with
    an events schema to post a valid event body" — meaning the OpenAPI alone is not sufficient to
    build a valid write.
  agent_note: >-
    For an agent this is a first-class capability and a first-class trap: it is a machine-readable,
    per-tenant contract that OpenAPI cannot express, and skipping it produces validation failures
    that no amount of spec reading would have predicted. Call /meta before every write.
  source: https://developers.adp.com/getting-started/key-concepts/intoduction-to-meta
idempotency:
  coverage: none
  supported: false
  header: null
  detail: >-
    ADP publishes no idempotency key. There is no Idempotency-Key header, no client-supplied request
    id that de-duplicates a replay, and none of the 362 harvested operations declares one. Re-posting
    an event after a timeout will create a second event. What ADP does provide is optimistic
    concurrency, which is a different guarantee: 346 of 353 200-responses return an ETag, the ETag
    description names If-Match and If-None-Match as its intended request headers, 178 operations
    declare 304 Not Modified and 324 declare 412 Precondition Failed. That protects against lost
    updates, not against duplicate submissions.
  related_mechanism: http-conditional-requests
  agent_guidance: >-
    Treat every event POST as non-idempotent. On a timeout, do not blind-retry — GET the affected
    resource (or the event's own status) and confirm whether the change landed before re-posting.
reversibility:
  grade: documented
  detail: >-
    ADP's event vocabulary is explicitly paired: nearly every .add event has a matching .remove, every
    assignment has a .terminate, leave has .cancel, and a terminated worker has .rehire. 48 of the 168
    write operations in the harvested Workforce Now contracts are reversal operations. What ADP does
    NOT publish anywhere in its developer documentation is a time window inside which a reversal is
    accepted — the constraint is instead effective-dating, which is per-client and per-product and is
    surfaced at runtime through /meta rather than stated as a policy. Because no window is stated,
    this grades as documented, not verified. Do not assume a payroll event can be reversed after the
    pay run has been processed; ADP does not say that it can.
  reversals:
    - {write: worker.personal-communication.email.add, reverse: worker.personal-communication.email.remove, operationId: db880d66-662c-492c-b03f-6318f1a67adc, window: not stated}
