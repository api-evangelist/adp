dry_run_mode:
  supported: partial
  detail: >-
    There is no ?dry_run flag, but /meta is a genuine rehearsal surface: it returns the exact
    field-level rules a write will be validated against, in the caller's own context, without
    mutating anything. Several talent events additionally split submission from approval through a
    paired .review event (associate.ksaoc.membership.remove.review), so the change can be staged
    before it takes effect.
