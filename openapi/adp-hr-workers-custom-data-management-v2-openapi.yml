    0px; background-color: rgb(255, 255, 255); text-decoration-thickness: initial; text-decoration-style: initial; text-decoration-color:
    initial; display: inline !important; float: none;''>The Worker Management API Guide for ADP Workforce Now describes how
    your application can access and manage information about workers in the ADP Workforce Now application. It helps you to
    determine which use case best meets your business needs. It also guides you through the implementation of each use case.A
    worker is a person who performs duties and responsibilities for an organization. In that capacity, a worker fills one
    or more positions through a work assignment. For a given work assignment, a worker is related to the organization n as
    an employee or contractor.</span><span style=''box-sizing: border-box; color: rgb(33, 33, 37); font-family: CircularXX,
    -apple-system, system-ui, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Fira Sans", "Droid Sans", "Helvetica Neue",
