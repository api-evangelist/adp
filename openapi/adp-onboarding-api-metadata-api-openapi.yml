        roleCodes:
        - practitioner
        - administrator
        scenarios:
        - summary: <p><span>Returns an applicant&#39;s metadata for Canada Template.</span></p><p><span>Important:</span></p><p>1. Whenever there is a change or update to any of the existing Custom template setup at ADP WorkForce Now side, the respective template Code&nbsp;in the API meta response gets updated.</p><p>2. It is recommended to call meta API (/hcm/v2/applicant.onboard/meta) to verify the template Codes before trying to onboard an employee using custom templates.</p>
          headers:
            ADP-Context-ExpressionID: country=CA
          name: 2. Returns an applicant's metadata for CANADA template.
          responses:
          - headers:
              ADP-Acting-Session-Expires: unset
              Cache-Control: unset
              sm_transactionid: unset
              ETag: unset
              ADP-Acting-SessionID: unset
              Content-Type: unset
            code: '200'
            description: Returns an API metadata including the list of minimum fields to create an in progress hire and the list of client hire templates
            content:
              application/json:
                externalValue: ./examples/2._Returns_an_applicant's_metadata_for_CANADA_template._Custom_Example_applicant.onboard.meta.read_200_353696.json
          - headers:
              ADP-Acting-Session-Expires: ''
              Cache-Control: ''
              sm_transactionid: ''
              ETag: ''
              ADP-Acting-SessionID: ''
              Content-Type: ''
            code: '200'
            description: Retrieves the template code available for the US client. /hcm/v2/applicant.onboard/meta?$filter=meta/applicantOnboarding/onboardingTemplateCode/code eq '{ItemID}'
            content:
              application/json:
                externalValue: ./examples/2._Returns_an_applicant's_metadata_for_CANADA_template._Custom_Example_applicant.onboard.meta.read_200_353697.json
          description: <p><span>Returns an applicant&#39;s metadata for Canada Template.</span></p><p><span>Important:</span></p><p>1. Whenever there is a change or update to any of the existing Custom template setup at ADP WorkForce Now side, the respective template Code&nbsp;in the API meta response gets updated.</p><p>2. It is recommended to call meta API (/hcm/v2/applicant.onboard/meta) to verify the template Codes before trying to onboard an employee using custom templates.</p>
        - summary: For time product TLM example meta response
