          parameters:
            $filter: meta/applicantOnboarding/onboardingTemplateCode/code eq '9360972_1439' and meta/applicantOnboarding/countryCode eq 'GB'
        - summary: If your template has custom fields for personal and employment will get a meta response similar to below, to fetch the custom fields ids and information can use<br>For Personal<br>/hcm/v1/validation-tables/person-custom-fields<br>For employment<br>/hcm/v1/validation-tables/worker-custom-fields<br><br>and to fetch on individual code list use the itemID for the list and send to similar api like<br>for personal<br>/hcm/v1/validation-tables/person-custom-fields/{itemID}<br>for employment<br>hcm/v1/validation-tables/worker-custom-fields/{itemID}
