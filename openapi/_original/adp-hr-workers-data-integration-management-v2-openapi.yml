info:
  contact:
    name: Mary Arem
    email: MARY.AREM@ADP.COM
  description: <span>The Worker Management API Guide for ADP Workforce Now describes how your application can access and manage
    information about workers in the ADP Workforce Now application. It helps you to determine which use case best meets your
    business needs. It also guides you through the implementation of each use case.A worker is a person who performs duties
    and responsibilities for an organization. In that capacity, a worker fills one or more positions through a work assignment.
    For a given work assignment, a worker is related to the organization n as an employee or contractor.</span><span>For more
    info refer&nbsp;</span><a href="https://developers.adp.com/articles/guides/worker-management-api-guide-for-adp-workforce-now"
    rel="noopener noreferrer" target="_blank"><span>Worker Management API Guide for ADP WFN.</span></a>
  title: Workers - Data Integration Management
  version: 2.0.15
