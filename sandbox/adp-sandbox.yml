  mechanism: /meta
  detail: 'GET <event>/meta returns the exact field-level validation rules a write will be checked against, in the caller''s own context, without mutating anything.'
self_serve: false
gate: >-
  A sandbox is not self-serve. Credentials and a certificate are issued only after a developer
  agreement is in place, through an ADP representative (API Central clients) or a Marketplace
  Technical Advisor (partners).
