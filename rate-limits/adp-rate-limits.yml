providerId: adp
created: '2026-05-04'
# Provenance stamped 2026-08-11: this artifact was written by the API Evangelist
# bulk sweep dated 2026-05-04, not harvested from the provider. See roadmap#35.
method: generated
modified: '2026-05-05'
reconciled: false
notes: ADP does not publish public rate-limit numbers. Limits are governed by partner agreements
  and may differ across products and environments.
tags:
  - Rate Limiting
  - HCM
  - Payroll
  - HR
description: ADP rate limits are not publicly documented. Limits apply per-partner and per-environment
  (sandbox vs production) and are enforced server-side. Partners should consult their ADP account
  representative for documented thresholds.
sources:
  - https://developers.adp.com/
responseCodes:
  throttled: 429
  serviceUnavailable: 503
limits:
  - name: Per-partner rate limit
    scope: account
    metric: varies
    limit: see ADP partner documentation
    notes: Not publicly disclosed; obtained via partner agreement.
policies:
  - name: Backoff
    description: Use exponential backoff with jitter on 429/503 responses; honor Retry-After when
      present.
  - name: Sandbox vs production
    description: Sandbox limits are smaller than production; do not load-test in sandbox.
  - name: Partner-scoped
    description: Limits are scoped to the registered partner application credentials, not per end-client.
