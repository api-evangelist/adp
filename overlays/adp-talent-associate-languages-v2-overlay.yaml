    are documented at https://developers.adp.com/getting-started/key-concepts/access-tokens.
  update:
  - url: https://api.adp.com
    description: ADP production API gateway (mutual TLS required)
  - url: https://api.eu.adp.com
    description: ADP European API gateway
  - url: https://uat-api.adp.com
    description: ADP UAT / sandbox gateway
- target: $.info
  update:
    x-apievangelist-source: https://api-library-marketplace.adp.com/hcm-offrg-wfn/talent/associate-languages/v2/associate-languages-swagger_v2-merged.json
    x-apievangelist-product: ADP Workforce Now (hcm-offrg-wfn)
    x-apievangelist-resource-path: talent/associate-languages/v2/associate-languages
    x-apievangelist-harvested: '2026-09-14'
    x-apievangelist-notes: Harvested from the ADP API Explorer spec library at api-library-marketplace.adp.com. operationIds
      are opaque UUIDs; the human-readable handle is summary + method + path. Every write is an event POST under /events/{domain}/v1/{eventName}
      and must be preceded by a GET of the same path + /meta for the per-tenant validation rules.
- target: $.components
  description: ADP declares no securitySchemes in any published document; authentication is an Authorization header parameter
    plus mutual TLS. Recorded here rather than injected, so the harvested contract stays verbatim.
