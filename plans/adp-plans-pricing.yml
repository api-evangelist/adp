specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: ADP
providerId: adp
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
notes: ADP does not publish public API pricing. Access is gated behind partnership/marketplace
  agreements; pricing is negotiated per-client. Scaffold retained as a placeholder.
tags:
  - Benefits
  - HCM
  - HR
  - Payroll
  - Workforce
description: ADP does not expose public per-tier API pricing. Commercial use requires becoming
  an ADP Marketplace partner or negotiating an enterprise agreement; pricing is custom and
  contract-based. Free sandbox access is available for partners during certification.
sources:
  - https://developers.adp.com/
plans:
  - id: adp-partner-sandbox
    name: Partner Sandbox
    type: freemium
    description: Free sandbox access for ADP Marketplace partners during integration and certification.
    entries:
      - label: Sandbox access
        name: sandbox
        type: quota
        metric: request
        limit: -1
        timeFrame: usage
        geo: global
        unit: 1
        price: '0.00'
        userMultiplied: false
    elements:
      - name: Sandbox endpoints
      - name: Partner documentation
      - name: Certification testing
  - id: adp-enterprise
    name: Enterprise / Marketplace Partner
    type: enterprise
    description: Production access for ADP Marketplace partners or direct enterprise customers.
      Pricing is custom and negotiated per contract.
    entries:
      - label: Custom contract
        name: custom
        type: subscription
        metric: contract
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: contact sales
        userMultiplied: false
    elements:
      - name: Production API access
      - name: Marketplace listing
      - name: SLA and support
      - name: Certified partner integrations
